name: Pull request integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_ENABLED: "0"
      RUN_COMM_SMOKE: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the offline integration gate
        run: bash scripts/test_integration.sh
