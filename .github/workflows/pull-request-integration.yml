name: Pull request integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-officer-segment1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Check live-tool dispatch and latency budgets
        run: nice -n 10 node --test tests/first_officer/segment1.test.mjs tests/first_officer/captain.test.mjs tests/first_officer/project-brief.test.mjs

  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_ENABLED: "0"
      RUN_COMM_SMOKE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned test dependency
        run: python -m pip install --requirement requirements-test.txt

      - name: Run the offline integration gate
        run: bash scripts/test_integration.sh

  first-officer-litellm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install LiteLLM acceptance dependencies
        run: python -m pip install --requirement requirements-litellm-test.txt
      - name: Generate the LiteLLM database client
        run: |
          schema=$(python -c 'from importlib.util import find_spec; from pathlib import Path; print(Path(find_spec("litellm").origin).parent / "proxy/schema.prisma")')
          prisma generate --schema "$schema"
      - name: Verify provider failover and isolate lane budgets
        env:
          FO_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
        run: nice -n 10 python tests/first_officer/litellm-acceptance.py

  first-officer-tracing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Phoenix and OpenLLMetry
        run: python -m pip install --requirement requirements-tracing-test.txt
      - name: Verify a trace arrives at the local collector
        run: nice -n 10 python tests/first_officer/tracing-acceptance.py
