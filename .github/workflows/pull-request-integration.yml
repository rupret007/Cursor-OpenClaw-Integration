name: Pull request integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_ENABLED: "0"
      RUN_COMM_SMOKE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned test dependency
        run: python -m pip install --requirement requirements-test.txt

      - name: Run the offline integration gate
        run: bash scripts/test_integration.sh
